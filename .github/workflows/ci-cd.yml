name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 .

  test:
    name: Tests (pytest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  deploy:
    name: Deploy to production VM
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Copy code to /opt/mortgage-app
        run: rsync -a --delete --exclude '.git' --exclude 'venv' ./ /opt/mortgage-app/

      - name: Install dependencies
        run: |
          cd /opt/mortgage-app
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements.txt

      - name: Restart service
        run: sudo systemctl restart mortgage-app

      - name: Health check
        run: curl --retry 10 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:8080/health
